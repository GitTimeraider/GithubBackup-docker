{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="navbar-brand-icon" style="width:56px;height:56px;border-radius:16px;background:var(--primary-gradient);box-shadow:0 8px 20px -6px rgba(124,58,237,0.5);">
                        <i class="fas fa-sign-in-alt" style="color:#fff;font-size:1.4rem;"></i>
                    </span>
                </div>
                <h3 class="card-title text-center mb-4">Login</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                                        <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                                <div class="mt-3 text-center">
                                    <a href="{{ url_for('forgot_password') }}" class="small">Forgot password?</a>
                                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
